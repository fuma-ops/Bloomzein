<title>Bloomzein Post Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;0,900;1,400;1,700&family=Dancing+Script:wght@500;600;700&family=Caveat:wght@500;600&family=Quicksand:wght@400;500;600;700&display=swap">
<style>
/* ============ tokens — one committed visual world: cream ground, plum ink ============ */
:root{
  --hot:#E6007E; --deep:#DB2777; --pink:#EC4899; --petal:#F9A8D4;
  --plum:#6B1238; --ink:#7A1440; --muted:#A2657F; --cream:#FFF7FB;
  --line:rgba(230,0,126,.16);
  --line-soft:rgba(230,0,126,.09);
  --panel:#FFFFFF;
  --shell:#FDF2F8;
  --shadow:0 1px 2px rgba(107,18,56,.06), 0 8px 24px -12px rgba(107,18,56,.18);
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--shell); color:var(--plum);
  font-family:Quicksand,"Segoe UI",system-ui,sans-serif; font-size:14px;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}

/* ============ shell ============ */
.shell{display:grid;grid-template-columns:186px minmax(0,1fr) 344px;height:100vh;height:100dvh;overflow:hidden}
.rail,.panel{background:var(--panel);overflow-y:auto;overscroll-behavior:contain}
.rail{border-right:1px solid var(--line-soft)}
.panel{border-left:1px solid var(--line-soft)}
.rail::-webkit-scrollbar,.panel::-webkit-scrollbar{width:9px}
.rail::-webkit-scrollbar-thumb,.panel::-webkit-scrollbar-thumb{background:rgba(230,0,126,.18);border-radius:9px;border:3px solid var(--panel)}

.brand{display:flex;align-items:center;gap:9px;padding:16px 14px 12px}
.brand .mark{width:26px;height:26px;flex:none}
.brand b{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:16px;letter-spacing:.01em;display:block;line-height:1.05}
.brand small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:2px}

.eyeb{font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 14px;margin:14px 0 8px}

/* template picker */
.thumbs{display:flex;flex-direction:column;gap:8px;padding:0 12px 22px}
.thumb{position:relative;border-radius:11px;padding:5px;border:1px solid var(--line-soft);background:#fff;text-align:left;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.thumb:hover{transform:translateY(-1px);box-shadow:var(--shadow);border-color:var(--line)}
.thumb:active{transform:scale(.985)}
.thumb[aria-pressed="true"]{border-color:var(--hot);box-shadow:0 0 0 1px var(--hot),0 10px 22px -14px rgba(230,0,126,.7)}
.thumb .frame{position:relative;width:100%;aspect-ratio:9/16;border-radius:7px;overflow:hidden;container-type:size;container-name:post;background:var(--cream);pointer-events:none}
/* thumbnails and filmstrip cards live outside .stage, so they never inherit its
   --safe-t/--safe-b — without a value, anything sizing itself off both insets at
   once (not just positioning off one) collapses to zero height. Always fixed 9:16. */
.thumb .frame,.scene .sframe{--safe-t:11.5%;--safe-b:22%}
/* static previews freeze the step-reveal covers open, so a still frame shows the
   photos rather than an arbitrary covered/uncovered instant */
.thumb .frame .cover,.scene .sframe .cover{animation:none !important;opacity:0 !important;transform:none !important}
.thumb .meta{display:flex;align-items:baseline;gap:6px;padding:7px 4px 3px}
.thumb .n{font-size:9px;font-weight:700;color:var(--hot);font-variant-numeric:tabular-nums}
.thumb .nm{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}

/* stage column */
.stagecol{display:flex;flex-direction:column;min-width:0}
.bar{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line-soft);flex:none;background:var(--panel)}
.seg{display:flex;background:var(--shell);border-radius:10px;padding:3px;gap:2px;border:1px solid var(--line-soft)}
.seg button{padding:6px 11px;border-radius:8px;font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--muted);transition:.15s}
.seg button[aria-pressed="true"]{background:#fff;color:var(--hot);box-shadow:0 1px 3px rgba(107,18,56,.12)}
.ghost{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:9px;border:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink);transition:.15s}
.ghost:hover{background:var(--shell);border-color:var(--hot)}
.ghost:active{transform:scale(.96)}
.ghost[aria-pressed="true"]{background:rgba(230,0,126,.08);border-color:var(--hot);color:var(--hot)}
.grow{flex:1}
.rec{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:10px;background:var(--hot);color:#fff;font-weight:700;font-size:12px;letter-spacing:.03em;box-shadow:0 6px 18px -8px rgba(230,0,126,.85);animation:breathe 2.8s ease-in-out infinite}
.rec:active{transform:scale(.96)}
@keyframes breathe{0%,100%{box-shadow:0 6px 18px -8px rgba(230,0,126,.85)}50%{box-shadow:0 8px 26px -6px rgba(230,0,126,1)}}

.canvas{flex:1;min-height:0;display:grid;place-items:center;padding:22px;background:
  radial-gradient(120% 90% at 50% 0%,#fff 0%,var(--shell) 60%)}

/* ── reel builder: hidden in single-post mode, a filmstrip + transport in reel mode ── */
.reelbar{display:none;flex:none;flex-direction:column;border-top:1px solid var(--line-soft);background:var(--panel)}
body.mode-reel .reelbar{display:flex}
body.mode-reel .canvas{padding-bottom:12px}
.reelbar-top{display:flex;align-items:center;gap:10px;padding:10px 16px 6px}
.reel-meta{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.reel-opt{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.reel-opt select{font:inherit;font-size:11.5px;font-weight:700;color:var(--ink);text-transform:none;letter-spacing:0;
  padding:5px 7px;border-radius:7px;border:1px solid var(--line);background:#fff}
.timeline{display:flex;align-items:stretch;height:34px;padding:0 16px;overflow-x:auto;border-top:1px solid var(--line-soft)}
.timeline:empty{display:none}
.tl-seg{position:relative;flex:none;height:100%;border-right:2px solid var(--panel)}
.tl-seg:last-child{border-right:none}
.tl-seg .tl-fill{position:absolute;inset:0;background:var(--shell)}
.tl-seg.active .tl-fill{background:rgba(230,0,126,.16)}
.tl-seg .tick{position:absolute;bottom:0;left:0;width:1px;height:6px;background:var(--line)}
.tl-seg .tick.end{height:100%;background:var(--line-soft)}
.tl-seg .tl-num{position:absolute;top:2px;left:4px;font-size:8.5px;font-weight:800;color:var(--muted);opacity:.75}
.tl-seg .tl-end{position:absolute;bottom:2px;right:3px;font-size:9px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.filmstrip{display:flex;gap:10px;padding:6px 16px 16px;overflow-x:auto;min-height:132px}
.reel-empty{margin:22px 16px;font-size:12px;color:var(--muted);font-weight:600;max-width:520px}
#bootBanner{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:999;display:flex;align-items:center;gap:10px;
  max-width:min(92vw,560px);padding:10px 14px;border-radius:11px;background:var(--ink);color:#fff;box-shadow:var(--shadow);font-size:12px;font-weight:600}
#bootBanner button{flex:none;font:inherit;font-weight:800;padding:6px 10px;border-radius:7px;background:rgba(255,255,255,.16);color:#fff}
#bootBanner button:hover{background:rgba(255,255,255,.28)}
#bootBanner #bootReset{background:var(--hot)}
#notice{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:200;display:flex;align-items:flex-start;gap:12px;
  max-width:min(92vw,520px);padding:12px 14px;border-radius:11px;background:var(--ink);color:#fff;
  box-shadow:var(--shadow);font-size:12px;font-weight:600;line-height:1.45}
#notice .body{display:flex;flex-direction:column;gap:9px;flex:1;min-width:0}
#notice button.x{flex:none;font:inherit;font-weight:800;color:#fff;opacity:.7;background:transparent;padding:0 2px}
#notice button.x:hover{opacity:1}
#notice .actrow{display:flex}
#notice .actbtn{font:inherit;font-weight:800;color:#fff;background:var(--hot);
  padding:8px 13px;border-radius:8px;white-space:nowrap}
#notice .actbtn:hover{filter:brightness(1.08)}
#notice .actbtn[disabled]{opacity:.6;cursor:default}
.framedhint{display:none;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--muted)}
body.framed .framedhint{display:flex}
.framedhint button{font:inherit;font-weight:800;color:var(--hot);background:transparent;text-decoration:underline;padding:0}
.scene{flex:none;width:96px;border-radius:11px;border:1px solid var(--line-soft);background:#fff;
  box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.scene:hover{transform:translateY(-2px)}
.scene.active{border-color:var(--hot);box-shadow:0 0 0 2px var(--hot)}
.scene{cursor:grab}
.scene.dragging{opacity:.4}
.scene.drag-over{border-color:var(--hot);box-shadow:0 0 0 3px rgba(230,0,126,.35);transform:scale(1.03)}
.scene .sframe{position:relative;width:100%;aspect-ratio:9/16;container-type:size;container-name:post;overflow:hidden;background:var(--cream);pointer-events:none}
.scene .sctrl{display:flex;align-items:center;justify-content:space-between;padding:3px 4px;background:var(--shell)}
.scene .sn{font-size:10px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.scene .sdur{display:flex;align-items:center;gap:3px;padding:3px 5px;font-size:9.5px;font-weight:700;color:var(--muted)}
.scene .sdur input{width:34px;font:inherit;font-size:10px;font-weight:700;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:1px 3px;text-align:right}
.scene .srow{display:flex;justify-content:flex-end;gap:2px;padding:2px 4px 4px}
.sbtn{width:19px;height:19px;border-radius:5px;font-size:11px;font-weight:800;color:var(--muted);line-height:1;background:transparent}
.sbtn:hover{background:#fff;color:var(--hot)}
.sbtn:disabled{opacity:.3;pointer-events:none}
.sbtn.danger:hover{color:#fff;background:var(--hot)}
body.mode-reel #thumbs .thumb{position:relative}
body.mode-reel #thumbs .thumb::after{content:"+ add";position:absolute;right:6px;bottom:6px;z-index:20;
  background:var(--hot);color:#fff;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 7px;border-radius:99px;box-shadow:0 2px 6px rgba(107,18,56,.35)}
.stage{
  position:relative; container-type:size; container-name:post;
  background:var(--cream); overflow:hidden;
  border-radius:12px; box-shadow:0 2px 6px rgba(107,18,56,.1),0 30px 60px -30px rgba(107,18,56,.45);
  --safe-t:11.5%; --safe-b:22%; --scrim:.62;
}
.stage[data-fmt="9x16"]{aspect-ratio:9/16;height:min(100%,calc((100vw - 700px) * 16 / 9));max-height:100%;max-width:100%}
.stage[data-fmt="4x5"]{aspect-ratio:4/5;--safe-t:7%;--safe-b:13%;height:min(100%,calc((100vw - 700px) * 5 / 4));max-height:100%;max-width:100%}
.stage[data-fmt="1x1"]{aspect-ratio:1/1;--safe-t:6%;--safe-b:9%;height:min(100%,calc(100vw - 700px));max-height:100%;max-width:100%}

/* safe zones */
.safe{position:absolute;inset:0;pointer-events:none;z-index:40;display:none}
body.guides .stage .safe{display:block}
.safe i{position:absolute;left:0;right:0;height:0;border-top:1px dashed rgba(255,255,255,.85);filter:drop-shadow(0 0 1px rgba(107,18,56,.6))}
.safe i:first-child{top:var(--safe-t)}
.safe i:last-child{bottom:var(--safe-b)}
.safe u{position:absolute;left:0;right:0;background:rgba(107,18,56,.16);text-decoration:none}
.safe u:first-of-type{top:0;height:var(--safe-t)}
.safe u:last-of-type{bottom:0;height:var(--safe-b)}

/* ============ panel ============ */
.panel{padding-bottom:28px}
.sect{border-bottom:1px solid var(--line-soft);padding:14px}
.sect h3{margin:0 0 11px;font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:7px}
.field{margin-bottom:10px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.05em;margin-bottom:4px}
.field input[type=text],.field textarea,.field input[type=number],.field select{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:12.5px;font-weight:500;color:var(--plum);transition:.15s}
.field textarea{resize:vertical;min-height:58px;line-height:1.45}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--hot);box-shadow:0 0 0 3px rgba(230,0,126,.1)}
.field input[type=color]{width:44px;height:34px;padding:2px;border-radius:8px;cursor:pointer}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}

.slider{display:grid;grid-template-columns:26px 1fr 44px;align-items:center;gap:8px;margin:5px 0}
.slider span:first-child{font-size:10px;font-weight:700;color:var(--muted)}
.slider output{font-size:10.5px;font-weight:700;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--petal),var(--hot));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--hot);box-shadow:0 1px 4px rgba(107,18,56,.3);cursor:grab}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--hot);cursor:grab}

.drop{position:relative;display:flex;align-items:center;gap:9px;padding:9px;border:1px dashed var(--line);border-radius:10px;background:var(--shell);transition:.15s}
.drop:hover{border-color:var(--hot)}
.drop .pv{width:38px;height:52px;border-radius:6px;overflow:hidden;flex:none;background:linear-gradient(150deg,#FDE7F3,#F9A8D4);display:grid;place-items:center}
.drop .pv img,.drop .pv video{width:100%;height:100%;object-fit:cover}
.drop .txt{min-width:0;flex:1}
.drop .txt b{display:block;font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drop .txt small{font-size:10px;color:var(--muted);font-weight:600}
.drop input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.mini{font-size:10px;font-weight:700;color:var(--hot);padding:4px 7px;border-radius:7px;border:1px solid var(--line);position:relative;z-index:2}
.mini:hover{background:#fff}

.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.sw p{margin:0;font-size:12px;font-weight:600}
.toggle{width:38px;height:21px;border-radius:99px;background:rgba(107,18,56,.16);position:relative;flex:none;transition:.2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.toggle[aria-pressed="true"]{background:var(--hot)}
.toggle[aria-pressed="true"]::after{transform:translateX(17px)}
.hint{font-size:10.5px;line-height:1.5;color:var(--muted);font-weight:500;margin:8px 0 0}

/* ============ record mode ============ */
body.rec-mode .rail,body.rec-mode .panel,body.rec-mode .bar{display:none}
body.rec-mode .shell{grid-template-columns:1fr}
body.rec-mode .canvas{padding:0;background:#000}
body.rec-mode .stage{border-radius:0;box-shadow:none;height:100vh;height:100dvh;max-width:100vw}
body.rec-mode .safe{display:none}
.exit{position:fixed;top:14px;right:14px;z-index:120;padding:8px 13px;border-radius:99px;background:rgba(255,255,255,.9);color:var(--plum);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:none}
body.rec-mode .exit{display:block}
.exit:hover{background:#fff}
.count{position:fixed;inset:0;z-index:130;display:none;place-items:center;background:rgba(107,18,56,.92);color:#fff}
body.counting .count{display:grid}
.count b{font-family:"Playfair Display",Georgia,serif;font-size:22vmin;font-weight:400;line-height:1;animation:pop .95s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.7)}30%{opacity:1;transform:scale(1)}100%{opacity:.15;transform:scale(1.08)}}

@media (max-width:1080px){
  .shell{grid-template-columns:1fr;height:auto;overflow:visible}
  .rail,.panel{border:0;border-top:1px solid var(--line-soft)}
  .thumbs{flex-direction:row;overflow-x:auto;padding-bottom:14px}
  .thumb{flex:none;width:104px}
  .canvas{padding:16px}
  .stage[data-fmt]{height:auto;width:min(100%,340px)}
}
</style>
<style>
/* ============================================================
   TEMPLATE SYSTEM — every value is a % of the stage, every type
   size is in cqw so one design holds at 9:16, 4:5 and 1:1 and
   still reads correctly inside a 104px-wide thumbnail.
   ============================================================ */
.tpl{--u:min(1cqw,.68cqh);position:absolute;inset:0;overflow:hidden;background:var(--cream);color:var(--plum)}
.slot{position:absolute;overflow:hidden}
#stage .slot[data-slot]{cursor:grab;touch-action:none}
#stage .slot[data-slot].cropping{cursor:grabbing}
.full{position:absolute;inset:0}
/* grids make their own children relative — never blanket-position everything,
   or absolutely-placed layers (scrims, glow, petals, phone) silently collapse */
.grid>.slot{position:relative}
.media{position:absolute;inset:0;transform:translate(var(--x,0%),var(--y,0%)) scale(var(--s,1));transform-origin:center}
.media>img,.media>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:ken 26s ease-in-out infinite alternate}
.ph{position:absolute;inset:0;animation:ken 26s ease-in-out infinite alternate}
@keyframes ken{from{transform:scale(1)}to{transform:scale(1.11)}}

/* placeholder art — generated, so the page ships with nothing external */
.ph1{background:radial-gradient(70% 60% at 30% 25%,#FFE3F1 0%,#F9A8D4 45%,#DB2777 100%)}
.ph2{background:radial-gradient(80% 70% at 70% 80%,#FFF7FB 0%,#FBCFE8 40%,#EC4899 100%)}
.ph3{background:linear-gradient(150deg,#FDE7F3 0%,#F9A8D4 40%,#7A1440 100%)}
.ph4{background:radial-gradient(60% 55% at 50% 35%,#FFF1F8 0%,#F9A8D4 55%,#6B1238 100%)}
.ph5{background:linear-gradient(30deg,#6B1238 0%,#DB2777 45%,#F9A8D4 100%)}
.ph6{background:radial-gradient(75% 65% at 25% 75%,#FFF7FB 0%,#FBCFE8 35%,#E6007E 100%)}
.ph::after{content:"";position:absolute;inset:0;background:
  radial-gradient(40% 30% at 22% 18%,rgba(255,255,255,.5),transparent 70%),
  radial-gradient(30% 26% at 78% 72%,rgba(255,255,255,.28),transparent 70%)}

/* scrims — always graded from a frame edge, never a floating blob */
.scrim-b,.scrim-t{position:absolute;left:0;right:0;pointer-events:none}
.scrim-b{bottom:0;height:66%;background:linear-gradient(to top,
  rgba(74,10,38,calc(.92*var(--scrim))) 0%,
  rgba(88,13,45,calc(.55*var(--scrim))) 38%,
  rgba(107,18,56,0) 100%)}
.scrim-t{top:0;height:42%;background:linear-gradient(to bottom,
  rgba(74,10,38,calc(.66*var(--scrim))) 0%,rgba(107,18,56,0) 100%)}

/* the copy block: framed with top/bottom so its inset is a share of HEIGHT.
   It spans a big chunk of the frame — pointer-events:none lets a drag started
   over its empty space (not actual text) reach the photo/clip underneath for
   crop-dragging; only the editable text itself needs to stay clickable */
.copy{position:absolute;left:7%;right:7%;top:var(--safe-t);bottom:var(--safe-b);
  display:flex;flex-direction:column;z-index:10;pointer-events:none;
  transform:translate(var(--cx,0%),var(--cy,0%)) scale(var(--cs,1));transform-origin:center}
.copy [contenteditable]{pointer-events:auto}
.t-outro .center{pointer-events:none}
.t-outro .center [contenteditable]{pointer-events:auto}

.an{animation:rise .42s cubic-bezier(.22,.75,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6%)}to{opacity:1;transform:none}}

/* filming/record effect — grain + vignette + a blinking REC timecode, z-indexed
   just above the raw photo (which has none) but below every template's own
   content layer (the lowest of which is 5), so it never covers any text */
.filmfx{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.filmfx .grain{position:absolute;inset:-12%;opacity:.15;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  background-size:170px 170px;animation:grainShift .5s steps(4) infinite}
.filmfx .vignette{position:absolute;inset:0;
  background:radial-gradient(120% 85% at 50% 50%,rgba(0,0,0,0) 56%,rgba(0,0,0,.4) 100%)}
/* top-right, not top-left like the reference — several templates already
   anchor their own badge/pill in the top-left of the safe zone (e.g. the
   POV label), and REC landing right on top of that read as visual clutter
   in testing; top-right stays clear across every template */
.filmfx .reclabel{position:absolute;top:calc(var(--safe-t) + 2%);right:6%;display:flex;align-items:center;gap:calc(.6*var(--u));
  font-family:Quicksand,sans-serif;font-weight:700;font-size:calc(2.4*var(--u));color:#fff;
  text-shadow:0 1px 4px rgba(0,0,0,.65);letter-spacing:.12em}
.filmfx .reclabel .dot{width:calc(1.5*var(--u));height:calc(1.5*var(--u));border-radius:50%;background:#ff3b3b;flex:none;
  box-shadow:0 0 calc(1.2*var(--u)) rgba(255,59,59,.9);animation:recBlink 1s steps(1) infinite}
@keyframes recBlink{0%,49%{opacity:1}50%,100%{opacity:.25}}
@keyframes grainShift{0%{transform:translate(0,0)}25%{transform:translate(-2%,1%)}50%{transform:translate(1%,-2%)}75%{transform:translate(-1%,-1%)}100%{transform:translate(0,0)}}
/* a quick autofocus snap plays once as the shot opens, camcorder-style: the
   reticle overshoots, "hunts" back and settles fast — then simply STAYS,
   held on screen until --focus-hold (half this clip's own duration, set per
   scene in JS) before fading out. Two separate animations rather than one,
   because the snap timing is fixed while the hold varies per clip. */
.filmfx .focusbox{position:absolute;left:50%;top:44%;width:30cqw;height:30cqw;transform:translate(-50%,-50%);
  border:calc(.16*var(--u)) solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);
  animation:focusSnap .8s cubic-bezier(.3,.9,.4,1) both,
            focusOut .45s ease var(--focus-hold,2s) forwards}
.filmfx .focusbox .dot{position:absolute;left:50%;top:50%;width:calc(1.2*var(--u));height:calc(1.2*var(--u));
  border-radius:50%;background:#fff;transform:translate(-50%,-50%)}
@keyframes focusSnap{
  0%{opacity:0;transform:translate(-50%,-50%) scale(1.55)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
  40%{opacity:1;transform:translate(-50%,-50%) scale(.92)}
  60%{opacity:1;transform:translate(-50%,-50%) scale(1.02)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
@keyframes focusOut{from{opacity:1}to{opacity:0}}
.t{display:block;outline:none;text-wrap:balance}
.t[contenteditable="true"]:hover{box-shadow:inset 0 -calc(.35*var(--u)) 0 rgba(230,0,126,.45)}
.t[contenteditable="true"]:focus{box-shadow:inset 0 -calc(.35*var(--u)) 0 var(--hot)}

/* shared type roles */
.k-eyebrow{font-family:Quicksand,sans-serif;font-weight:700;font-size:calc(2.9*var(--u));letter-spacing:.34em;text-transform:uppercase}
.k-script{font-family:"Dancing Script",cursive;font-weight:600;line-height:.95}
.k-hand{font-family:Caveat,cursive;font-weight:600}
.k-serif{font-family:"Playfair Display",Georgia,serif}
.k-body{font-family:Quicksand,sans-serif;font-weight:500;line-height:1.4}
.on-photo{color:#fff;text-shadow:0 calc(.3*var(--u)) calc(1.6*var(--u)) rgba(60,6,30,.35)}

/* drifting petal layer — nothing on this page is ever a static frame */
.petals{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.petals svg{position:absolute;top:-12%;animation:drift linear infinite}
@keyframes drift{
  0%{transform:translate3d(0,-14%,0) rotate(0deg);opacity:0}
  10%{opacity:.75}
  90%{opacity:.5}
  100%{transform:translate3d(calc(6*var(--u)),118cqh,0) rotate(220deg);opacity:0}
}
.glow{position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(230,0,126,.42),rgba(230,0,126,0) 68%);animation:pulse 5.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.9;transform:scale(1.06)}}

/* ============================================================
   SCRAPBOOK CHROME — torn-paper tags, washi tape, polaroid photo
   frames, checklist cards and hand-drawn doodles. This is the
   real-life-collage voice: paper sits ON the photo, never behind it.
   ============================================================ */
.paper{position:relative;background:#FFFDFB;
  box-shadow:0 calc(1.4*var(--u)) calc(3.2*var(--u)) -calc(1.6*var(--u)) rgba(60,6,30,.4),0 1px 0 rgba(60,6,30,.05);
  clip-path:polygon(0 3%,4% 0,11% 1.6%,19% 0,27% 1.4%,35% .3%,44% 1.8%,53% 0,61% 1.5%,70% .4%,79% 1.7%,88% 0,96% 1.3%,100% 3%,
    100% 97%,95% 100%,87% 98.3%,79% 100%,70% 98.5%,61% 100%,52% 98.2%,44% 100%,35% 98.6%,27% 100%,19% 98.4%,11% 100%,4% 98.7%,0 97%)}
.tape{position:absolute;background:linear-gradient(100deg,rgba(244,120,178,.88),rgba(249,168,212,.66) 55%,rgba(244,120,178,.88));
  box-shadow:0 1px 3px rgba(60,6,30,.22);z-index:2}
.tape::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.4) 0 2px,transparent 2px 7px)}

.doodle{position:absolute;color:var(--hot);opacity:.85;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(60,6,30,.12))}

/* brand watermark — a quiet flower + wordmark, present on every scene so a
   reel still reads as Bloomzein mid-sequence, not only on the outro */
/* sits in the platform-reserved strip below the safe area, like a permanent
   corner tag — small and subtle enough that a caption/button overlapping it
   there is fine, but never competing with a template's own bottom content */
.brandmark{position:absolute;right:4%;bottom:2.4%;z-index:16;opacity:0;
  animation:rise .5s cubic-bezier(.22,.75,.2,1) forwards;
  display:flex;align-items:center;gap:.3em;background:rgba(255,255,255,.94);
  padding:.3em .6em .3em .42em;border-radius:999px;box-shadow:0 2px 6px rgba(60,6,30,.22);pointer-events:none}
.brandmark svg{width:calc(2.2*var(--u));height:calc(2.2*var(--u));color:var(--hot);flex:none}
.brandmark span{font-family:Quicksand;font-weight:700;font-size:calc(1.7*var(--u));letter-spacing:.02em;color:var(--plum);white-space:nowrap}

/* the big reveal — the Outro template's flower + wordmark moment, reusable as an
   overlay on top of any scene's own photo or clip, timed to a chosen second */
.brandreveal{position:absolute;inset:0;z-index:17;pointer-events:none}
.brandreveal .scrim{position:absolute;left:0;right:0;bottom:0;height:54%;
  background:linear-gradient(to top,rgba(60,6,30,.8),rgba(60,6,30,.38) 55%,rgba(60,6,30,0))}
.brandreveal .stack{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 3%);
  display:flex;flex-direction:column;align-items:center;gap:calc(.5*var(--u));text-align:center;padding:0 10%}
.brandreveal .glow{position:absolute;left:50%;bottom:5cqh;width:26cqw;height:26cqw;transform:translateX(-50%);
  border-radius:50%;background:radial-gradient(circle,rgba(230,0,126,.55),rgba(230,0,126,0) 70%);
  opacity:0;animation:pulse 2.4s ease-in-out infinite}
.brandreveal .flower{width:11cqw;height:11cqw;opacity:0;animation:outroFlowerIn 1s cubic-bezier(.34,1.56,.64,1) forwards}
.brandreveal .flower svg{width:100%;height:100%;color:#fff;
  filter:drop-shadow(0 calc(.4*var(--u)) calc(1.1*var(--u)) rgba(60,6,30,.4));animation:outroSpin 14s linear infinite}
.brandreveal .word{display:block;font-family:"Dancing Script",cursive;font-weight:700;font-size:calc(6.4*var(--u));
  color:#fff;line-height:1;opacity:0;animation:outroRise .6s cubic-bezier(.22,.75,.2,1) forwards}
.brandreveal .tag{display:block;font-family:Quicksand;font-weight:600;font-size:calc(2.2*var(--u));
  color:rgba(255,255,255,.92);opacity:0;animation:outroRise .5s cubic-bezier(.22,.75,.2,1) forwards}
.doodle.an{animation:doodlepop .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes doodlepop{0%{opacity:0;transform:scale(.35) rotate(-10deg)}62%{opacity:1;transform:scale(1.18) rotate(4deg)}100%{opacity:1;transform:scale(1) rotate(0)}}

/* word-by-word reveal — used for playback/export, never inside the live editable box */
.wr{display:inline-block;animation:rise .5s cubic-bezier(.22,.75,.2,1) both}

/* checklist card — the app-preview list style (Move / Nourish / Journal …) */
.checklist{background:#fff;border-radius:calc(2.6*var(--u));padding:calc(2.2*var(--u)) calc(2.6*var(--u));
  box-shadow:0 calc(1.6*var(--u)) calc(3.6*var(--u)) -calc(1.6*var(--u)) rgba(60,6,30,.42);display:flex;flex-direction:column}
.checklist li{list-style:none;display:flex;align-items:center;gap:calc(1.8*var(--u));
  padding:calc(1.05*var(--u)) 0;border-bottom:1px solid rgba(122,20,64,.1)}
.checklist li:last-child{border-bottom:0}
.checklist li .dot{width:calc(4.4*var(--u));height:calc(4.4*var(--u));border-radius:50%;flex:none;
  background:linear-gradient(155deg,#FDE7F3,var(--petal));display:grid;place-items:center;color:var(--hot)}
.checklist li .t{flex:1;font-family:Quicksand;font-weight:600;font-size:calc(3.1*var(--u));color:var(--plum)}
.checklist li .ok{width:calc(3.4*var(--u));height:calc(3.4*var(--u));border-radius:50%;flex:none;
  background:var(--hot);color:#fff;display:grid;place-items:center}
.checklist li .ok svg{width:62%;height:62%}

.pill{display:inline-block;background:var(--hot);color:#fff;padding:.12em .5em;border-radius:.28em;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}

/* highlight styles — decorative treatments for a scene's own hero word
   (whichever element carries .hi or .pill), selectable per scene. Applied
   alongside .hl-active, which clears the plain .pill fill so the chosen
   treatment's own background (behind the word, via ::before) actually shows. */
/* position+z-index together opens a fresh, LOCAL stacking context, so the
   decoration's z-index:-1 tucks behind this word's own text only — without
   it, -1 escapes upward past .paper/.tpl (neither of which stack on their
   own) and paints behind the whole card, or the photo, invisibly */
.hi.hl-active,.pill.hl-active{background:transparent;position:relative;z-index:0}
.hl-pill::before{content:"";position:absolute;inset:-.1em -.32em;z-index:-1;background:rgba(249,168,212,.55);border-radius:999px}
.hl-rect::before{content:"";position:absolute;inset:-.07em -.24em;z-index:-1;background:rgba(249,168,212,.6);border-radius:.32em}
.hl-stroke::before{content:"";position:absolute;inset:-.03em -.32em;z-index:-1;background:rgba(249,168,212,.62);
  clip-path:polygon(1% 22%,100% 4%,99% 82%,0% 96%)}
.hl-brush::before{content:"";position:absolute;inset:-.12em -.38em;z-index:-1;background:rgba(255,247,251,.94);
  clip-path:polygon(2% 30%,22% 6%,48% 18%,71% 2%,98% 20%,96% 78%,74% 96%,50% 82%,26% 98%,3% 74%)}
.hl-circle::before{content:"";position:absolute;inset:-.16em -.42em;z-index:-1;border:.09em solid currentColor;
  border-radius:50%;transform:rotate(-3deg);opacity:.85}
.hl-tape::before{content:"";position:absolute;inset:16% -.36em;z-index:-1;transform:rotate(-1.5deg);
  background:linear-gradient(100deg,rgba(244,120,178,.88),rgba(249,168,212,.62) 55%,rgba(244,120,178,.88));
  box-shadow:0 1px 3px rgba(60,6,30,.22)}
.hl-tape::after{content:"";position:absolute;inset:16% -.36em;z-index:-1;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.4) 0 2px,transparent 2px 7px)}
.hl-marks::before,.hl-marks::after{position:absolute;top:50%;transform:translateY(-50%);font-family:Quicksand;
  font-weight:700;color:var(--hot);font-size:.62em;opacity:.85}
.hl-marks::before{content:"›";left:-.6em}
.hl-marks::after{content:"‹";right:-.6em}
.hl-blob::before{content:"";position:absolute;inset:-.18em -.4em;z-index:-1;background:rgba(249,168,212,.55);
  border-radius:63% 37% 54% 46%/42% 47% 53% 58%;transform:rotate(-2deg)}
.hl-underline::after{content:"";position:absolute;left:-.05em;right:-.05em;bottom:-.14em;height:.09em;
  background:var(--hot);border-radius:99px}
.hl-heart::after{content:"";position:absolute;right:-.45em;top:-.32em;width:.6em;height:.55em;z-index:2;
  background:var(--hot);clip-path:path('M12 20C4 14.8 1.5 10.6 1.5 6.9 1.5 3.8 3.9 2 6.5 2c2 0 3.8 1.3 5.5 3.6C13.7 3.3 15.5 2 17.5 2c2.6 0 5 1.8 5 4.9 0 3.7-2.5 7.9-10.5 13.1Z')}
.hl-glass::before{content:"";position:absolute;inset:-.1em -.36em;z-index:-1;background:rgba(255,255,255,.55);
  border-radius:.6em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.75),0 2px 8px rgba(60,6,30,.14)}
.hl-glow::before{content:"";position:absolute;inset:-.55em -.75em;z-index:-1;border-radius:50%;
  background:radial-gradient(circle,rgba(230,0,126,.45),rgba(230,0,126,0) 70%)}

/* ---- 1 HOOK + REAL MOMENT — full-bleed photo, bold line, one torn note ---- */
.t-hook .full{position:absolute;inset:0;filter:saturate(.96)}
.t-hook .scrim-t{height:36%}
.t-hook .copy{justify-content:space-between}
.t-hook .hookline{display:flex;flex-direction:column;align-items:flex-start;gap:calc(1*var(--u))}
.t-hook .pov{background:var(--hot);color:#fff;padding:.28em .8em;border-radius:999px;font-family:Quicksand;
  font-weight:700;font-size:calc(2.5*var(--u));letter-spacing:.14em;text-transform:uppercase;width:fit-content}
.t-hook .line{font-family:Quicksand;font-weight:700;font-size:calc(6.6*var(--u));line-height:1.08;color:#fff;
  text-shadow:0 calc(.3*var(--u)) calc(1.8*var(--u)) rgba(60,6,30,.4);max-width:72cqw}
.t-hook .note{position:relative;align-self:flex-start;padding:calc(1.7*var(--u)) calc(2.3*var(--u));transform:rotate(-1.6deg);max-width:74cqw}
.t-hook .note .t{font-family:"Playfair Display",serif;font-style:italic;font-weight:500;font-size:calc(3.7*var(--u));line-height:1.28;color:var(--plum)}
.t-hook .doodle.heart{right:calc(-2.6*var(--u));bottom:calc(-2.4*var(--u));width:calc(4.8*var(--u))}

/* ---- 2 PROBLEM + EMPATHY — full-bleed photo, one torn note near the top ---- */
.t-empathy .full{position:absolute;inset:0}
.t-empathy .scrim-t{height:44%}
.t-empathy .copy{justify-content:flex-start}
.t-empathy .note{position:relative;padding:calc(2.1*var(--u)) calc(2.5*var(--u));transform:rotate(-2deg);max-width:82cqw}
.t-empathy .line1{display:block;font-family:"Playfair Display",serif;font-weight:500;font-size:calc(4.4*var(--u));line-height:1.15;color:var(--plum)}
.t-empathy .line1.hi{font-style:italic;font-weight:700;color:var(--hot);font-size:calc(8.4*var(--u));line-height:1}
.t-empathy .line2{display:block;margin-top:calc(1.1*var(--u));font-family:Quicksand;font-weight:600;
  font-size:calc(2.9*var(--u));color:var(--muted);line-height:1.4}

/* ---- 3 ROUTINE OVERVIEW — a full-bleed collage, one script word ---- */
.t-routine .grid{position:absolute;inset:0;display:grid;grid-template-columns:1.15fr 1fr;grid-template-rows:1fr 1fr;gap:calc(.7*var(--u))}
.t-routine .grid .slot{position:relative;overflow:hidden}
.t-routine .grid .slot:first-child{grid-row:span 2}
.t-routine .scrim-b{height:46%}
.t-routine .tagline{position:absolute;left:8%;top:calc(var(--safe-t) + 1%);z-index:12;display:flex;flex-direction:column;gap:calc(.3*var(--u))}
.t-routine .tagline .pre{font-family:Quicksand;font-weight:700;font-size:calc(2.5*var(--u));letter-spacing:.22em;text-transform:uppercase;color:#fff;text-shadow:0 1px 5px rgba(60,6,30,.5)}
.t-routine .tagline .post{font-family:Quicksand;font-weight:600;font-size:calc(3*var(--u));color:#fff;text-shadow:0 1px 5px rgba(60,6,30,.5)}
.t-routine .word{position:absolute;left:8%;right:8%;bottom:calc(var(--safe-b) + 3%);z-index:12;
  font-family:"Dancing Script",cursive;font-weight:700;font-size:calc(12*var(--u));color:#fff;line-height:1;
  text-shadow:0 calc(.4*var(--u)) calc(2.2*var(--u)) rgba(60,6,30,.55)}

/* ---- 4 SOLUTION + APP FOCUS — full-bleed photo (the phone is in the shot), one line ---- */
.t-appfocus .full{position:absolute;inset:0}
.t-appfocus .scrim-b{height:52%}
.t-appfocus .copy{justify-content:flex-end}
.t-appfocus .headline{font-family:Quicksand;font-weight:700;font-size:calc(5.6*var(--u));line-height:1.16;color:#fff;
  text-shadow:0 calc(.3*var(--u)) calc(1.8*var(--u)) rgba(60,6,30,.4)}
.t-appfocus .headline .pill{font-size:.96em}

/* ---- 5 FEATURE HIGHLIGHT — full-bleed photo, one checklist card ---- */
.t-feature .full{position:absolute;inset:0;filter:saturate(.94)}
.t-feature .scrim-t{height:30%}
.t-feature .copy{justify-content:flex-end;gap:calc(1.3*var(--u))}
.t-feature .titlewrap{align-self:center;position:relative;transform:rotate(-1.5deg)}
.t-feature .titlewrap .tape{width:30%;height:calc(2.6*var(--u));left:35%;top:calc(-1.3*var(--u));transform:rotate(3deg)}
.t-feature .titlewrap .paper{padding:calc(1.1*var(--u)) calc(2.4*var(--u));text-align:center}
.t-feature .title{display:block;font-family:"Playfair Display",serif;font-weight:500;font-size:calc(5*var(--u));line-height:1.2;color:var(--plum)}
.t-feature .title.script{font-family:"Dancing Script",cursive;font-weight:700;color:var(--hot);font-size:calc(5.6*var(--u));margin-top:.05em}
.t-feature li .t{font-size:calc(2.9*var(--u))}

/* ---- 6 MOTIVATION + AESTHETIC — full-bleed photo, plain on-photo line, nothing else ---- */
.t-motivation .full{position:absolute;inset:0}
.t-motivation .scrim-b{height:40%}
.t-motivation .copy{justify-content:flex-end;gap:calc(.3*var(--u))}
.t-motivation .line{font-family:Quicksand;font-weight:700;font-size:calc(6.8*var(--u));line-height:1.08;color:#fff;
  text-shadow:0 calc(.3*var(--u)) calc(1.8*var(--u)) rgba(60,6,30,.4)}

/* ---- 7 EDUCATION + VALUE — full-bleed photo, one torn note, one doodle ---- */
.t-education .full{position:absolute;inset:0}
.t-education .scrim-b{height:34%}
.t-education .copy{justify-content:flex-end}
.t-education .note{position:relative;align-self:flex-start;padding:calc(1.8*var(--u)) calc(2.4*var(--u));transform:rotate(-1.8deg);max-width:78cqw}
.t-education .pre{display:block;font-family:Quicksand;font-weight:600;font-size:calc(3.2*var(--u));color:var(--ink);line-height:1.3}
.t-education .bracket{display:block;margin-top:calc(.3*var(--u));font-family:"Playfair Display",serif;font-style:italic;font-weight:700;
  font-size:calc(4.4*var(--u));color:var(--hot);line-height:1.15}
.t-education .doodle.heart{right:calc(-2.4*var(--u));top:calc(-2.2*var(--u));width:calc(4.6*var(--u))}

/* ---- 8 TIPS + HOW-TO — full-bleed photo, plain stacked line with two pill words ---- */
.t-tips .full{position:absolute;inset:0}
.t-tips .scrim-b{height:44%}
.t-tips .copy{justify-content:flex-end}
.t-tips .stack{display:flex;flex-direction:column;align-items:flex-start;gap:calc(.7*var(--u))}
.t-tips .line{font-family:Quicksand;font-weight:700;font-size:calc(5.6*var(--u));line-height:1.05;color:#fff;
  text-shadow:0 calc(.3*var(--u)) calc(1.6*var(--u)) rgba(60,6,30,.4)}
.t-tips .pill{font-family:Quicksand;font-weight:700;font-size:calc(5.6*var(--u));line-height:1}

/* ---- 9 TREND + ENGAGEMENT — a full-bleed collage, one taped tag, one doodle arrow ---- */
.t-trend .grid{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:calc(.7*var(--u))}
.t-trend .grid .slot{position:relative;overflow:hidden}
.t-trend .tagwrap{position:absolute;left:8%;top:calc(var(--safe-t) + 4%);z-index:13;transform:rotate(-2.5deg)}
.t-trend .tagwrap .tape{width:32%;height:calc(2.6*var(--u));left:34%;top:calc(-1.3*var(--u));transform:rotate(3deg)}
.t-trend .title{display:block;padding:calc(1.3*var(--u)) calc(2.2*var(--u));font-family:"Playfair Display",serif;font-weight:500;
  font-style:italic;font-size:calc(4.6*var(--u));line-height:1.15;color:var(--plum)}
.t-trend .sub{position:absolute;z-index:13;background:var(--hot);color:#fff;font-family:Quicksand;font-weight:700;
  font-size:calc(2.6*var(--u));letter-spacing:.06em;padding:.5em 1em;border-radius:999px;transform:rotate(3deg)}
.t-trend .doodle.arrow{z-index:13;width:calc(9*var(--u))}

/* ---- 10 CURIOSITY + DISCOVERY — full-bleed photo, plain line, one small torn note ---- */
.t-curiosity .full{position:absolute;inset:0;filter:saturate(.94)}
.t-curiosity .scrim-b{height:40%}
.t-curiosity .doodle.spark{right:9%;top:calc(var(--safe-t) + 4%);width:calc(5.6*var(--u))}
.t-curiosity .copy{justify-content:flex-end;gap:calc(1.2*var(--u))}
.t-curiosity .line{font-family:Quicksand;font-weight:700;font-size:calc(5.6*var(--u));line-height:1.1;color:#fff;
  text-shadow:0 calc(.3*var(--u)) calc(1.6*var(--u)) rgba(60,6,30,.4)}
.t-curiosity .note{position:relative;align-self:flex-start;padding:calc(1.4*var(--u)) calc(2*var(--u));transform:rotate(-2deg)}
.t-curiosity .note .pov{font-family:Quicksand;font-weight:700;font-size:calc(2.6*var(--u));letter-spacing:.16em;color:var(--hot)}
.t-curiosity .note .blank{display:block;margin-top:calc(.2*var(--u));font-family:"Playfair Display",serif;font-style:italic;
  font-weight:600;font-size:calc(3.6*var(--u));color:var(--plum)}

/* ---- 11 STEP REVEAL — four zones unlock one by one, built for curiosity ---- */
.t-steps{background:var(--cream)}
.t-steps .kicker{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 1%);z-index:14;text-align:center}
.t-steps .kicker .t{display:inline-block;font-family:Quicksand;font-weight:700;font-size:calc(2.6*var(--u));letter-spacing:.22em;text-transform:uppercase;color:var(--hot)}
.t-steps .title{position:absolute;left:8%;right:8%;top:calc(var(--safe-t) + 5.5%);z-index:14;text-align:center;
  font-family:"Playfair Display",serif;font-weight:500;font-style:italic;font-size:calc(4.4*var(--u));line-height:1.16;color:var(--plum)}
.t-steps .zones{position:absolute;left:6%;right:6%;top:calc(var(--safe-t) + 16%);bottom:calc(var(--safe-b) + 2.5%);
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:calc(1.6*var(--u))}
.t-steps .zone{position:relative;border-radius:calc(2.4*var(--u));overflow:hidden;
  box-shadow:0 calc(1*var(--u)) calc(2.6*var(--u)) -calc(1.4*var(--u)) rgba(60,6,30,.4)}
.t-steps .zone .slot{position:absolute;inset:0}
.t-steps .zone .cap{position:absolute;left:0;right:0;bottom:0;padding:calc(1*var(--u)) calc(1.4*var(--u)) calc(1.1*var(--u));
  background:linear-gradient(to top,rgba(60,6,30,.72),transparent);z-index:5}
.t-steps .zone .cap .t{font-family:Quicksand;font-weight:700;font-size:calc(2.2*var(--u));color:#fff;line-height:1.2}
.t-steps .zone .num{position:absolute;left:calc(.9*var(--u));top:calc(.9*var(--u));z-index:6;
  width:calc(4.6*var(--u));height:calc(4.6*var(--u));border-radius:50%;background:#fff;color:var(--hot);
  display:grid;place-items:center;font-family:"Playfair Display",serif;font-weight:700;font-size:calc(2.4*var(--u));
  box-shadow:0 2px 6px rgba(60,6,30,.3)}
.t-steps .cover{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(.6*var(--u));background:linear-gradient(155deg,var(--hot),var(--deep));
  animation:stepReveal 7s cubic-bezier(.65,0,.35,1) infinite;transform-origin:center}
.t-steps .zone:nth-child(1) .cover{animation-delay:0s}
.t-steps .zone:nth-child(2) .cover{animation-delay:.55s}
.t-steps .zone:nth-child(3) .cover{animation-delay:1.1s}
.t-steps .zone:nth-child(4) .cover{animation-delay:1.65s}
.t-steps .cover b{font-family:"Playfair Display",serif;font-weight:700;font-size:calc(6*var(--u));color:#fff;line-height:1}
.t-steps .cover span{font-family:Quicksand;font-weight:700;font-size:calc(1.8*var(--u));letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.t-steps .cover::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);
  animation:coverGlow 1.8s ease-in-out infinite}
@keyframes stepReveal{
  0%,4%{opacity:1;transform:scale(1) rotate(0deg)}
  12%{opacity:0;transform:scale(.2) rotate(-16deg)}
  88%{opacity:0;transform:scale(.2) rotate(-16deg)}
  96%,100%{opacity:1;transform:scale(1) rotate(0deg)}
}
@keyframes coverGlow{0%,100%{opacity:.5}50%{opacity:1}}

/* ---- 12 OUTRO — photo/clip behind a rotating flower, wordmark, CTA, app link, in 4s ---- */
.t-outro{background:linear-gradient(165deg,#FFF7FB 0%,#FDE7F3 46%,#F9A8D4 100%)}
.t-outro .full{position:absolute;inset:0}
/* light enough that an uploaded photo/clip still reads clearly behind the
   flower — not the near-opaque wash that would just hide it — but still a
   consistent magenta-plum tint so white text stays legible either way,
   whether that's over the pale placeholder or a real photo */
.t-outro .outroscrim{position:absolute;inset:0;
  background:radial-gradient(120% 90% at 50% 45%,rgba(230,0,126,.26) 0%,rgba(157,10,74,.46) 55%,rgba(74,10,38,.66) 100%)}
.t-outro .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(1.4*var(--u));text-align:center;padding:0 8%;z-index:5}
.t-outro .flowerglow{position:absolute;left:50%;top:37%;width:40cqw;height:40cqw;transform:translate(-50%,-50%);
  border-radius:50%;background:radial-gradient(circle,rgba(230,0,126,.48),rgba(230,0,126,0) 70%);
  animation:pulse 2.4s ease-in-out infinite}
.t-outro .flowerwrap{width:21cqw;height:21cqw;animation:outroFlowerIn 1s cubic-bezier(.34,1.56,.64,1) both}
.t-outro .flowerwrap svg{width:100%;height:100%;color:var(--hot);
  filter:drop-shadow(0 calc(.6*var(--u)) calc(1.6*var(--u)) rgba(60,6,30,.35));
  animation:outroSpin 16s linear 1s infinite}
.t-outro .wordmark{display:block;font-family:"Dancing Script",cursive;font-weight:700;font-size:calc(11*var(--u));
  color:#FFF7FB;line-height:1;text-shadow:0 calc(.3*var(--u)) calc(1.6*var(--u)) rgba(60,6,30,.55);
  opacity:0;animation:outroRise .7s cubic-bezier(.22,.75,.2,1) 1.6s forwards}
.t-outro .tagline{display:block;font-family:"Playfair Display",serif;font-style:italic;font-weight:500;
  font-size:calc(3.2*var(--u));color:#FFF7FB;text-shadow:0 1px 8px rgba(60,6,30,.5);
  opacity:0;animation:outroRise .6s cubic-bezier(.22,.75,.2,1) 2.6s forwards}
.t-outro .ctawrap{margin-top:calc(.6*var(--u));opacity:0;animation:outroRise .6s cubic-bezier(.22,.75,.2,1) 3.2s forwards}
.t-outro .cta{display:inline-block;padding:.62em 1.4em;background:var(--hot);color:#fff;border-radius:999px;
  font-family:Quicksand;font-weight:700;font-size:calc(2.7*var(--u));letter-spacing:.03em;
  animation:ctaBreathe 2.4s ease-in-out 3.8s infinite}
.t-outro .applink{display:flex;flex-direction:column;align-items:center;gap:calc(.3*var(--u));
  margin-top:calc(.3*var(--u));opacity:0;animation:outroRise .5s cubic-bezier(.22,.75,.2,1) 3.5s forwards}
.t-outro .applink svg{width:calc(3.2*var(--u));height:calc(3.2*var(--u));color:#FFF7FB;filter:drop-shadow(0 1px 4px rgba(60,6,30,.5))}
.t-outro .applink span{font-family:Quicksand;font-weight:700;font-size:calc(2.2*var(--u));color:#FFF7FB;text-shadow:0 1px 6px rgba(60,6,30,.5)}
@keyframes outroFlowerIn{0%{opacity:0;transform:scale(.3) rotate(-70deg)}65%{opacity:1;transform:scale(1.12) rotate(10deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes outroSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes outroRise{from{opacity:0;transform:translateY(10%)}to{opacity:1;transform:translateY(0)}}
@keyframes ctaBreathe{
  0%,100%{box-shadow:0 calc(.8*var(--u)) calc(2*var(--u)) -calc(.6*var(--u)) rgba(230,0,126,.75)}
  50%{box-shadow:0 calc(1.2*var(--u)) calc(3*var(--u)) -calc(.4*var(--u)) rgba(230,0,126,1)}
}

  border:1px solid rgba(255,247,251,.6);border-radius:999px;font-family:Quicksand;font-weight:700;
  font-size:calc(2.2*var(--u));color:#FFF7FB}

.t-montage3 .bands{position:absolute;inset:0;display:flex;flex-direction:column}
.t-montage3 .band{position:relative;flex:1;overflow:hidden}
.t-montage3 .band .cap{position:absolute;left:0;right:0;text-align:center;z-index:5;

  color:#fff;text-shadow:0 calc(.3*var(--u)) calc(1.5*var(--u)) rgba(60,6,30,.5)}
.t-montage3 .band:nth-child(1) .cap{top:48%}
.t-montage3 .band:nth-child(2) .cap{top:45%}
.t-montage3 .band:nth-child(3) .cap{top:12%}

.stage[data-fmt="4x5"] .copy{left:10%;right:10%}

</style>

<script>
"use strict";
/* ─────────────────────────────── helpers ─────────────────────────────── */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

/* text slot + image slot writers used by every template */
const T = (k, cls = "", tag = "span") =>
  `<${tag} class="t an ${cls}" data-t="${k}" contenteditable="plaintext-only" spellcheck="false"></${tag}>`;
const IMG = (k, cls = "", ph = 1) =>
  `<div class="slot an ${cls}" data-slot="${k}"><div class="media" data-media="${k}"><div class="ph ph${ph}"></div></div></div>`;
const PETALS = n => `<div class="petals" data-petals="${n}"></div>`;
/* the brand mark is opt-in per scene (off by default everywhere), added from
   the settings panel, never baked into a template's own html() — so it never
   hides or competes with whatever photo/clip is already in that slot */
/* scene-wide type overrides — every size in a template is calc(N * var(--u)),
   so scaling the one shared unit scales every piece of type (and the
   decoration sized off it) together, proportionally, without touching any
   per-template CSS. Color/font are simpler: a blanket inline override on
   every text element, since colors and fonts are hand-picked per element
   with no single shared variable to redirect the way --u covers size. */
/* the elements that carry a solid card/pill/chip behind their own text —
   the torn-paper note, a highlighted pill word, the day-in-life time chip,
   the feature checklist card — as opposed to plain type sitting on a photo,
   which has no background to recolor */
const BG_CARRIERS = ".paper,.pill,.time,.checklist";
const HL_STYLES = ["hl-pill", "hl-rect", "hl-stroke", "hl-brush", "hl-circle", "hl-tape", "hl-marks", "hl-blob", "hl-underline", "hl-heart", "hl-glass", "hl-glow"];
const NO_CARD_SHADOW = "0 1px 4px rgba(60,6,30,.55), 0 1px 14px rgba(60,6,30,.4)";
function applyStyleOverrides(root, st) {
  const sc = st.style || {};
  if (sc.scale && sc.scale !== 1) root.style.setProperty("--u", `calc(min(1cqw, .68cqh) * ${sc.scale})`);

/* IndexedDB where it is allowed, memory where it is not: some embedded
   frames refuse storage outright, and a refused save must never look like
   a dead button — the media still loads, it just won't survive a reload. */
let storageNote = "";
const DB = (() => {
  const mem = new Map();
  let p = null, broken = false;
  const open = () => {
    if (broken) return Promise.reject(new Error("no idb"));
    return p || (p = new Promise((res, rej) => {
      let r;
      try { r = indexedDB.open("bloomzein-post-studio", 1); } catch (e) { return rej(e); }
      r.onupgradeneeded = () => r.result.createObjectStore("media", { keyPath: "id" });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error("blocked"));
    }).catch(e => { broken = true; throw e; }));
  };
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction("media", mode), rq = fn(t.objectStore("media"));
      rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
    });
  };
  const fell = () => { if (!storageNote) storageNote = "This browser blocked local storage for this page, so your photos and clips load for this session only."; };
  return {
    async put(id, blob, name, kind) {
      mem.set(id, { id, blob, name, kind });
      try { await tx("readwrite", s => s.put({ id, blob, name, kind })); }
      catch (e) { fell(); }
      return id;
    },
    async get(id) {
      if (mem.has(id)) return mem.get(id);
      try { return await tx("readonly", s => s.get(id)); }
      catch (e) { fell(); return null; }
    },
    async del(id) {
      mem.delete(id);
      try { await tx("readwrite", s => s.delete(id)); } catch (e) { }
    },
  };
})();
const urls = new Map();
async function mediaURL(id) {
  if (urls.has(id)) return urls.get(id);
  const rec = await DB.get(id); if (!rec) return null;
  const u = URL.createObjectURL(rec.blob); urls.set(id, u); return u;
}

function applyText(root, st) {

    el.style.setProperty("--x", f.x + "%"); el.style.setProperty("--y", f.y + "%"); el.style.setProperty("--s", f.s);

}
async function applyMedia(root, st, mode) {
  for (const [k, m] of Object.entries(st.media || {})) {
    const holder = $(`[data-media="${k}"]`, root); if (!holder || !m || !m.id) continue;
    const u = await mediaURL(m.id);
    if (!u) { st.media[k] = { id: null, kind: "image", name: "", in: 0, out: 0 }; save(); continue; }

        // reel scene card would otherwise be its own live, looping, decoding video all at
        // once (and rebuilt from scratch on nearly every keystroke), which is exactly the
        // kind of runaway memory/GPU load that crashes the tab. One seek, one paint, done.
        v.loop = false; v.autoplay = false; v.preload = "metadata";

/* ─────────────────────────── photo/clip filters ───────────────────────── */
const FX_FILTERS = {
  "": "",
  latte: "sepia(.25) saturate(1.2) brightness(1.08) contrast(.95) hue-rotate(-6deg)",
  memo: "grayscale(.4) sepia(.16) contrast(.9) brightness(1.03) saturate(.82)",
  dark: "brightness(.76) contrast(1.18) saturate(.88) hue-rotate(-4deg)",

}

/* ───────────────────────── filming / record effect ────────────────────── */
/* how long this scene is on screen — its own duration in a reel, else the

function sceneDuration(st) {

/* a camcorder overlay — grain + vignette + a blinking REC label, plus a

  el.className = "filmfx";

    <div class="focusbox"><i class="dot"></i></div>

    $(".grain", el).style.display = "none";
    $(".focusbox", el).style.display = "none";
  } else {

    $(".focusbox", el).style.setProperty("--focus-hold", (sceneDuration(st) / 2) + "s");

/* every template's reveal choreography lands at exactly 4s, whether it has
   3 elements or 10 — the stagger step is computed backward from that, never
   a fixed 80ms, so the last piece always finishes right on 4000ms */
const REVEAL_TOTAL = 4000, REVEAL_DUR = 420;
function stagger(root) {
  const els = $$(".an", root); if (!els.length) return;
  const step = els.length > 1 ? (REVEAL_TOTAL - REVEAL_DUR) / (els.length - 1) : 0;
  els.forEach((el, i) => { el.style.animationDelay = Math.round(i * step) + "ms"; });
}

  $$("[data-count]", root).forEach(el => {
    const target = parseFloat(st.text[el.dataset.t]); if (!isFinite(target)) return;
    const t0 = performance.now(), dur = 900;
    const tick = now => {
      const p = clamp((now - t0) / dur, 0, 1), e = 1 - Math.pow(1 - p, 3);
      if (document.activeElement === el) { el.textContent = st.text[el.dataset.t]; return; }
      el.textContent = p < 1 ? String(Math.round(target * e)) : st.text[el.dataset.t];
      if (p < 1) requestAnimationFrame(tick);

/* mode: "edit" (interactive, in the main stage) · "thumb" (static, tiny preview)
   · "play" (animated, read-only — reel playback and export) */
function buildTplRoot(def, st, mode) {
  const root = document.createElement("div");
  root.className = "tpl t-" + def.id;
  root.dataset.tpl = def.id;
  root.innerHTML = def.html();

  applyStyleOverrides(root, st); applyFx(root, st); applyFilmFx(root, st, mode);
  if (mode === "thumb") {
    $$("[data-petals]", root).forEach(l => l.remove());
    $$(".an", root).forEach(el => el.classList.remove("an"));
    $$("[contenteditable]", root).forEach(el => el.removeAttribute("contenteditable"));
  } else {

}
function wordSplit(el) {

}

/* ── crossfade / slide swap between two `.tpl` roots — used on every template
   switch and to cut between scenes when a reel plays or exports ── */
// per-type timing: "dissolve" is deliberately longer with an ease-in-out
// curve that lingers at the start — the outgoing clip fades out gradually
// while the next one gathers in underneath it, both moving at once, rather
// than the snappier default crossfade's quick, even blend
const TRANSITION_TIMING = {

  const { dur, easing } = TRANSITION_TIMING[type] || { dur: 550, easing: "cubic-bezier(.22,.75,.2,1)" };
  // slideL/slideR are mirror images (right-to-left vs left-to-right), same for
  // slideU/slideD (bottom-to-top vs top-to-bottom) — each pair shares the same
  // motion, just negated, so the new clip always enters from the named edge
  const OUT = {
    fade: [{ opacity: 1 }, { opacity: 0 }],
    dissolve: [{ opacity: 1 }, { opacity: 0 }],
    slideL: [{ opacity: 1, transform: "translateX(0)" }, { opacity: 0, transform: "translateX(-5%)" }],
    slideR: [{ opacity: 1, transform: "translateX(0)" }, { opacity: 0, transform: "translateX(5%)" }],
    slideU: [{ opacity: 1, transform: "translateY(0)" }, { opacity: 0, transform: "translateY(-5%)" }],
    slideD: [{ opacity: 1, transform: "translateY(0)" }, { opacity: 0, transform: "translateY(5%)" }],
  }[type] || [{ opacity: 1 }, { opacity: 0 }];

    fade: [{ opacity: 0 }, { opacity: 1 }],
    dissolve: [{ opacity: 0 }, { opacity: 1 }],
    slideL: [{ opacity: 0, transform: "translateX(5%)" }, { opacity: 1, transform: "translateX(0)" }],
    slideR: [{ opacity: 0, transform: "translateX(-5%)" }, { opacity: 1, transform: "translateX(0)" }],
    slideU: [{ opacity: 0, transform: "translateY(5%)" }, { opacity: 1, transform: "translateY(0)" }],
    slideD: [{ opacity: 0, transform: "translateY(-5%)" }, { opacity: 1, transform: "translateY(0)" }],
  }[type] || [{ opacity: 0 }, { opacity: 1 }];
  const p1 = fromEl.animate(OUT, { duration: dur, easing, fill: "forwards" }).finished.catch(() => { });
  const p2 = toEl.animate(IN, { duration: dur, easing, fill: "forwards" }).finished.catch(() => { });
  return Promise.all([p1, p2]).then(() => fromEl.remove());
}

function refreshPreview(def) { S.mode === "reel" ? renderFilmstrip() : renderThumb(def.id); }

function renderStage() {

  const old = olds[olds.length - 1] || null;

/* ── template rail thumbnails ── */
function renderThumb(id) {

}
function buildThumbs() {

    <button class="thumb" data-thumb="${t.id}" aria-pressed="${t.id === S.tpl && S.mode === "single"}" title="${esc(t.hint)}">

/* ══════════════════════════════ REEL BUILDER ══════════════════════════════
   A reel is an ordered list of scenes; each scene is one template instance
   with its own independent text/photos, so the same template can appear
   twice in a reel without the two copies fighting over one set of content. */
const uid = () => "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

}

  S.reel.splice(idx, 1); delete S.sceneState[id];
  if (S.activeScene === id) S.activeScene = (S.reel[Math.max(0, idx - 1)] || S.reel[0])?.id || null;
  save();

}

  const j = idx + dir; if (j < 0 || j >= S.reel.length) return;
  [S.reel[idx], S.reel[j]] = [S.reel[j], S.reel[idx]];

function updateReelMeta() {

    const dur = sc.duration || 4, start = cum, end = cum + dur; cum = end;

    return `<div class="tl-seg ${sc.id === S.activeScene ? "active" : ""}" data-scene="${sc.id}" style="width:${Math.round(dur * TL_PXPS)}px" title="Scene ${i + 1}: ${start.toFixed(1)}s – ${end.toFixed(1)}s">

function renderFilmstrip() {

    bar.innerHTML = `<p class="reel-empty">Click any template on the left to add it as your first scene — keep clicking to build the reel, in order. Reuse the same template as many times as you like; each copy keeps its own text and photos.</p>`;
    updateReelMeta(); return;
  }
  bar.innerHTML = S.reel.map((sc, i) => `
    <div class="scene ${sc.id === S.activeScene ? "active" : ""}" data-scene="${sc.id}" title="${esc(TPL[sc.tpl].name)} — drag to reorder">
      <div class="sframe"></div>
      <div class="sctrl">
        <button class="sbtn" type="button" data-act="left" ${i === 0 ? "disabled" : ""} title="Move earlier">‹</button>
        <span class="sn">${i + 1}</span>

      </div>

      <div class="srow">
        <button class="sbtn" type="button" data-act="dup" title="Duplicate scene">⧉</button>
        <button class="sbtn danger" type="button" data-act="del" title="Remove scene">✕</button>
      </div>
    </div>`).join("");
  $$(".scene", bar).forEach(el => {
    const id = el.dataset.scene, sc = S.reel.find(s => s.id === id), def = TPL[sc.tpl], st = sceneState(id);

    el.addEventListener("click", e => { if (!e.target.closest("[data-act]")) selectScene(id); });
    $('[data-act="left"]', el)?.addEventListener("click", e => { e.stopPropagation(); moveScene(id, -1); });
    $('[data-act="right"]', el)?.addEventListener("click", e => { e.stopPropagation(); moveScene(id, 1); });
    $('[data-act="dup"]', el).addEventListener("click", e => { e.stopPropagation(); duplicateScene(id); });
    $('[data-act="del"]', el).addEventListener("click", e => { e.stopPropagation(); removeScene(id); });
    $('[data-act="dur"]', el).addEventListener("input", e => { sc.duration = clamp(+e.target.value || 4, .6, 8); save(); updateReelMeta(); renderTimeline(); });
    $('[data-act="dur"]', el).addEventListener("click", e => e.stopPropagation());

    /* drag to reorder — the ‹ › buttons stay as the precise, no-drag alternative */
    el.draggable = true;
    el.addEventListener("dragstart", e => {
      dragSceneId = id; el.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", id);
    });
    el.addEventListener("dragend", () => { dragSceneId = null; $$(".scene", bar).forEach(x => x.classList.remove("dragging", "drag-over")); });
    el.addEventListener("dragover", e => { if (dragSceneId && dragSceneId !== id) { e.preventDefault(); e.dataTransfer.dropEffect = "move"; el.classList.add("drag-over"); } });
    el.addEventListener("dragleave", () => el.classList.remove("drag-over"));
    el.addEventListener("drop", e => {
      e.preventDefault(); el.classList.remove("drag-over");
      if (!dragSceneId || dragSceneId === id) return;
      const from = S.reel.findIndex(s => s.id === dragSceneId), to = S.reel.findIndex(s => s.id === id);
      if (from < 0 || to < 0) return;
      const [moved] = S.reel.splice(from, 1);
      S.reel.splice(to, 0, moved);
      save(); blip(700, .08); renderFilmstrip();
    });
  });
  updateReelMeta();
}

function sleep(ms, signal) {
  return new Promise((res, rej) => {
    const t = setTimeout(res, ms);
    signal?.addEventListener("abort", () => { clearTimeout(t); rej(new DOMException("aborted", "AbortError")); });
  });
}
async function playReelSequence(container, { signal } = {}) {
  for (const sc of S.reel) {
    if (signal?.aborted) throw new DOMException("aborted", "AbortError");
    const def = TPL[sc.tpl], st = sceneState(sc.id);
    const root = buildTplRoot(def, st, "play");
    const old = $(".tpl", container);
    container.insertBefore(root, $(".safe", container) || null);
    await crossTransition(old, root, S.transition || "fade");
    if (signal?.aborted) throw new DOMException("aborted", "AbortError");
    await sleep((sc.duration || 4) * 1000, signal);
  }
}

<script>

function sliderRow(sym, min, max, step, val, fmt, onInput) {

  const r = $("input", w), o = $("output", w);

  r.addEventListener("change", () => blip(540, .07));

}

  const s = document.createElement("section"); s.className = "sect";
  s.innerHTML = `<h3><svg width="13" height="13" style="color:var(--hot)"><use href="#${icon}"/></svg>${title}</h3>`;

  if (x) { $("input", x).value = f.x; $("output", x).textContent = f.x + "%"; }
  if (y) { $("input", y).value = f.y; $("output", y).textContent = f.y + "%"; }

    cropDrag.lastX = e.clientX; cropDrag.lastY = e.clientY;
    const f = cropDrag.st.frames[cropDrag.k];
    f.x = clamp(f.x + dx, -50, 50); f.y = clamp(f.y + dy, -50, 50);
    const root = $(".tpl", stage); if (root) applyFrames(root, cropDrag.st);
    syncCropSliders(cropDrag.k, f);
  });
  const endDrag = () => { if (!cropDrag) return; cropDrag.slotEl.classList.remove("cropping"); save(); cropDrag = null; };
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);
  stage.addEventListener("wheel", e => {
    const slotEl = e.target.closest("[data-slot]"); if (!slotEl || !stage.contains(slotEl)) return;
    const st = currentState(); if (!st) return;
    const k = slotEl.dataset.slot, f = st.frames[k]; if (!f) return;
    e.preventDefault();
    f.s = clamp(f.s - e.deltaY * .001, 1, 3);
    const root = $(".tpl", stage); if (root) applyFrames(root, st);
    syncCropSliders(k, f); save();
  }, { passive: false });
}
function wireDrop(drop, onFile) {
  const input = $("input[type=file]", drop);
  const pick = () => { try { input.click(); } catch (e) { } };
  $(".mini.pick", drop)?.addEventListener("click", e => { e.stopPropagation(); pick(); });
  drop.addEventListener("click", e => { if (!e.target.closest(".mini") && e.target !== input) pick(); });
  input.addEventListener("change", e => { const f = e.target.files[0]; if (f) onFile(f); input.value = ""; });
  ["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.style.borderColor = "var(--hot)"; }));
  ["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.style.borderColor = ""; }));
  drop.addEventListener("drop", e => { const f = e.dataTransfer?.files?.[0]; if (f) onFile(f); });
}

let audio = null;
async function loadMusic() {
  const M = S.music; if (!M.id) return;
  const u = await mediaURL(M.id); if (!u) return;
  audio = new Audio(u); audio.volume = M.vol; audio.preload = "auto";
  audio.addEventListener("timeupdate", () => {
    const out = M.out > 0 ? Math.min(M.out, audio.duration || M.out) : (audio.duration || 0);
    if (!out) return;
    const left = out - audio.currentTime;
    audio.volume = M.fade > 0 ? M.vol * clamp(left / M.fade, 0, 1) : M.vol;
    if (left <= .05) { audio.currentTime = M.in || 0; audio.volume = M.vol; }
  });
}
function startMusic() { if (!audio) return; audio.currentTime = S.music.in || 0; audio.volume = S.music.vol; audio.play().catch(() => { }); }
function stopMusic() { if (!audio) return; audio.pause(); }
