}
function countdown(n = 3) {
  document.body.classList.add("counting");
  $("#countNum").textContent = n;
  return new Promise(res => {
    const iv = setInterval(() => {
      n--;
      if (n > 0) { $("#countNum").textContent = n; $("#countNum").style.animation = "none"; void $("#countNum").offsetWidth; $("#countNum").style.animation = ""; blip(560, .1); }
      else { clearInterval(iv); document.body.classList.remove("counting"); res(); }
    }, 1000);
  });
}
$("#recBtn").addEventListener("click", async () => {
  document.body.classList.add("rec-mode");
  $$(".tpl [data-t]", stage).forEach(el => el.setAttribute("contenteditable", "false"));
  blip(500, .12);
  await countdown(3);
  renderStage();
  $$(".tpl [data-t]", stage).forEach(el => el.setAttribute("contenteditable", "false"));
  startMusic();
});
$("#exitBtn").addEventListener("click", exitRecord);
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("rec-mode")) { reelAbort?.abort(); exitRecord(); } });

/* ══════════════════════════ reel playback & export ════════════════════════ */
/* An in-page notice rather than alert(): a sandboxed embed can have modals
   switched off entirely, and a blocked alert() is how "the export button
   does nothing" looks from the outside — no dialog, no file, no reason.
   `url` shows the page address as SELECTABLE TEXT with a copy button, not
   as a link: an embed sandboxed without allow-popups blocks target="_blank"
   and window.open alike, so a link here is a button that does nothing.
   Copy-and-paste into the address bar is the one route out that always
   works, so that is what the notice offers. */
function notice(msg, ms = 7000, action = null) {
  $("#notice")?.remove();
  const el = document.createElement("div");
  el.id = "notice";
  el.innerHTML = `<div class="body"><span></span>${action ? `<div class="actrow"><button type="button" class="actbtn"></button></div>` : ""}</div>
    <button type="button" class="x" aria-label="Dismiss">✕</button>`;
  $("span", el).textContent = msg;
  if (action) {
    const btn = $(".actbtn", el);
    btn.textContent = action.label;
    btn.addEventListener("click", () => action.run(btn));
  }
  $(".x", el).addEventListener("click", () => el.remove());
  document.body.appendChild(el);
  if (ms) setTimeout(() => el.remove(), ms);
  return el;
}

/* Whether this page may capture the screen at all. Being in a frame is NOT
   the test — a frame permitted display-capture records fine, and the
   claude.ai viewer keeps the page framed even at its own address, so
   "open it in a new tab" is advice that leads in a circle. Ask the
   permissions policy directly; null means the browser won't say, and an
   unknown answer must not produce a warning. */
function captureAllowed() {
  if (!navigator.mediaDevices?.getDisplayMedia) return false;
  try {
    const fp = document.featurePolicy || document.permissionsPolicy;
    if (fp?.allowsFeature) return !!fp.allowsFeature("display-capture");
  } catch (e) { }
  return null;
}

/* ── the way out of a page that cannot record: save a standalone copy ──
   Screen capture is refused to this page, and it cannot open a tab for
   itself either (a sandboxed embed blocks target=_blank and window.open
   alike). What it CAN do is hand over a complete .html file — the studio
   plus this project's text, layout and clips baked in — which opens as an
   ordinary local page where recording is allowed and the reel exports
   normally. */
/* Packing must never build the whole file as one JS string. A clip becomes
   a base64 string ~1.37x its size, and a JS string is UTF-16, so a handful
   of phone videos turned into "one big string, stringified, replaced, then
   Blob'd" is several copies of hundreds of megabytes — which is exactly how
   this crashed the tab. Instead each clip is encoded on its own and folded
   straight into a Blob part, so the big strings become garbage immediately
   and the JS heap only ever holds one clip at a time. */
const SEED_LIMIT = 1.2e9; /* refuse rather than crash */
function blobToDataURL(blob) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => res(r.result); r.onerror = () => res(null);
    r.readAsDataURL(blob);
  });
}
function projectMediaRecords() {
  const wanted = new Map();
  const scan = st => { for (const m of Object.values(st?.media || {})) if (m?.id) wanted.set(m.id, m); };
  Object.values(S.t || {}).forEach(scan);
  Object.values(S.sceneState || {}).forEach(scan);
  if (S.music?.id) wanted.set(S.music.id, { id: S.music.id, kind: "audio", name: S.music.name });
  return wanted;
}
async function saveStandaloneCopy(btn, skipMedia = false) {
  const label = t => { if (btn) btn.textContent = t; };
  if (btn) btn.disabled = true;
  const done = () => { if (btn) { btn.disabled = false; btn.textContent = "Save studio as a file"; } };
  try {
    label("Reading page…");
    let src = "";
    try { src = await (await fetch(location.href, { cache: "no-store" })).text(); } catch (e) { }
    // Anchor on the doctype at the very start of the file, never on <body>:
    // this page has no literal <body> tag, so a /<body[^>]*>/ search matches
    // THIS function's own regex literal further down and injects the seed
    // into the middle of the script. Anchored at ^, nothing in the code can
    // match, and sitting right after the doctype keeps standards mode while
    // guaranteeing the seed runs before the app's own scripts.
    // Keep the FETCHED source whenever there is one: fetch decodes as UTF-8
    // regardless of what header the page was served with, whereas
    // documentElement.outerHTML inherits whatever the browser guessed — so
    // when the page is served without a charset, outerHTML is already
    // mojibake and saving it bakes the damage in. outerHTML is a last
    // resort only, for when the fetch itself failed.
    if (src) { if (!/^\s*<!doctype/i.test(src)) src = "<!doctype html>\n" + src; }
    else src = "<!doctype html>\n" + document.documentElement.outerHTML;
    const doctype = /^\s*<!doctype[^>]*>/i.exec(src);
    const cut = doctype[0].length;
    const seedId = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    // declare the encoding first: the saved file is opened from disk with no
    // server header to say UTF-8, and without this the browser sniffs Latin-1
    // and mangles every accent, dash and symbol in the page AND in your text
    const parts = [src.slice(0, cut), "\n<meta charset=\"utf-8\">",
      "\n<script>window.__BZ_SEED__={\"id\":" + JSON.stringify(seedId) + ",\"state\":",
      JSON.stringify(S).replace(/<\//g, "<\\/"), ",\"media\":["];
    const tailHTML = src.slice(cut);

    const wanted = skipMedia ? new Map() : projectMediaRecords();
    const recs = [];
    let total = 0;
    for (const [id, meta] of wanted) {
      const rec = await DB.get(id);
      if (rec?.blob) { recs.push({ id, rec, meta }); total += rec.blob.size; }
    }
    if (total > SEED_LIMIT) {
      done();
      notice(`This project's clips come to ${(total / 1048576).toFixed(0)} MB — too much to fold into one file without running the browser out of memory. Save it without the clips and re-add them in the saved copy, or trim the reel down first.`, 0,
        { label: "Save without clips", run: b => saveStandaloneCopy(b, true) });
      return;
    }

    let i = 0;
    for (const { id, rec, meta } of recs) {
      label(`Packing ${++i} of ${recs.length}…`);
      const dataURL = await blobToDataURL(rec.blob);
      if (dataURL) {
        // stringified per clip and handed straight to a Blob, so both the
        // base64 and the JSON copy of it are collectable before the next one
        parts.push(new Blob([(i > 1 ? "," : "") + JSON.stringify({
          id, kind: rec.kind || meta.kind || "image",
          name: String(rec.name || meta.name || "").replace(/[<>]/g, ""),
          dataURL,
        })]));
      }
      await new Promise(r => setTimeout(r, 0));
    }
    parts.push("]};<\/script>", tailHTML);

    label("Saving…");
    const blob = new Blob(parts, { type: "text/html;charset=utf-8" });
    const res = await deliverFile(blob, "bloomzein-post-studio.html");
    done();
    if (res.ok) notice(skipMedia
      ? `Saved bloomzein-post-studio.html (${(blob.size / 1048576).toFixed(1)} MB) with your text and reel, but WITHOUT the clips — re-add those in the saved copy, then Export there.`
      : `Saved bloomzein-post-studio.html (${(blob.size / 1048576).toFixed(1)} MB) — your text, reel and clips are inside it. Open that file in Chrome and Export works there.`, 0);
    else notice(res.msg, 10000);
  } catch (e) {
    done();
    notice("Couldn't pack the project into a file (" + (e?.message || e) + "). If it has large video clips, try trimming the reel down first.", 12000);
  }
}
const saveCopyAction = { label: "Save studio as a file", run: saveStandaloneCopy };

/* A saved copy carries its project and loads it on first open. The test is
   NOT "does this browser already have a project" — opening any earlier
   saved copy leaves one behind, and file:// pages often share one storage
   area, so that check silently skipped the import and the file opened
   empty. Instead each saved copy carries its own id and is imported once
   per browser: a different copy always loads, and re-opening the same file
   keeps whatever was edited in it since. */
const SEED_MARK = KEY + ":seed";
async function importSeed() {
  const seed = window.__BZ_SEED__;
  if (!seed?.id) return null;
  try { if (localStorage.getItem(SEED_MARK) === seed.id) return null; } catch (e) { }
  if (seed.state) S = Object.assign(blank(), seed.state);
  let loaded = 0;
  for (const m of seed.media || []) {
    try {
      const blob = await (await fetch(m.dataURL)).blob();
      await DB.put(m.id, blob, m.name || "", m.kind || "image");
      loaded++;
    } catch (e) { }
  }
  try { localStorage.setItem(SEED_MARK, seed.id); } catch (e) { }
  save();
  return { clips: loaded, expected: (seed.media || []).length };
}

/* Inside the claude.ai artifact viewer a plain <a download> — blob: URLs
   included — is inert: a page only ever hands the viewer a file through the
   downloads capability. Anywhere else (bloomzein.com, or this file opened
   on its own) that capability doesn't exist and the anchor is the only way.
   Try the capability, fall back to the anchor, and say which happened. */
async function deliverFile(blob, filename) {
  let downloads = null;
  try { downloads = await window.claude?.use?.("downloads"); } catch (e) { }
  if (downloads) {
    try { await downloads.save({ filename, data: blob }); return { ok: true }; }
    catch (e) {
      const code = e?.code || "";
      if (code === "declined") return { ok: false, msg: "Download cancelled — your reel wasn't saved." };
      if (code === "rate_limited") return { ok: false, msg: "A save prompt is already open — finish that one, then export again." };
      return { ok: false, msg: "Couldn't save the file (" + (code || e?.message || "unknown error") + ")." };
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  return { ok: true };
}

/* Crop the captured tab down to the stage element, so the file is a true
   9:16 (or 4:5 / 1:1) video instead of the whole browser window with the
   post sitting in the middle of it. Region Capture is Chromium-only —
   without it the recording still works, it's just the full window. */
async function cropToStage(track) {
  try {
    if (window.CropTarget?.fromElement && track.cropTo) {
      await track.cropTo(await CropTarget.fromElement(stage));
      return true;
    }
  } catch (e) { }
  return false;
}

/* The capture can only contain pixels the screen actually rendered, so the
   one honest lever on quality is making the post physically bigger before
   recording: fullscreen gives it the whole display height at native device
   pixel ratio. On a 4K screen that turns a 9:16 post into ~1215x2160 of
   real detail instead of ~600x1080 in a window. */
const FS_SETTLE = 450;
function enterFullscreen() {
  try { return document.documentElement.requestFullscreen?.({ navigationUI: "hide" })?.catch(() => { }); }
  catch (e) { return null; }
}
function exitFullscreen() {
  try { if (document.fullscreenElement) document.exitFullscreen?.().catch(() => { }); } catch (e) { }
}

let reelAbort = null;
async function runReel({ record = false } = {}) {
  if (!S.reel.length) { notice("Add at least one scene to your reel first — click a template on the left to add it."); return; }

  let recorder = null, chunks = [], stream = null, track = null;
  if (record) {
    if (!navigator.mediaDevices?.getDisplayMedia) {
      notice("This page isn't allowed to record the screen, so it can't build the video here. Save the studio as a file — your clips and text come with it — then open that file in Chrome and Export works.",
        0, saveCopyAction);
      return;
    }
    // Ask for the capture FIRST, while the click that started this still
    // counts as user activation — behind the 3s countdown the activation has
    // long expired and the browser rejects the request outright.
    try {
      // both started inside the one click: awaiting fullscreen first would
      // spend the transient activation that getDisplayMedia also requires
      enterFullscreen();
      stream = await navigator.mediaDevices.getDisplayMedia({
        video: { frameRate: 30 }, audio: true,
        preferCurrentTab: true, selfBrowserSurface: "include", surfaceSwitching: "exclude",
      });
    } catch (e) {
      exitFullscreen();
      const blocked = e?.name === "NotAllowedError";
      // A picker that never opened is the page being refused permission; a
      // picker the viewer closed is a dismissal. Only the first needs the file.
      const refused = blocked && captureAllowed() === false;
      const why = !blocked
        ? "Couldn't start screen capture (" + (e?.name || "unknown error") + ")."
        : refused
          ? "This page isn't allowed to record the screen — that's why no picker appeared. Save the studio as a file (your clips and text come with it), open that file in Chrome, and Export works there."
          : "No video was captured. If a picker appeared, click Export again and choose \"This tab\", ticking \"Also share tab audio\" for your music. If no picker appeared at all, this page isn't allowed to record — save the studio as a file and open that in Chrome instead.";
      notice(why, 0, blocked ? saveCopyAction : null);
      return;
    }
    track = stream.getVideoTracks()[0];
    // Fullscreen first, and let layout settle, so the post is rendered as
    // large as the display allows BEFORE the capture geometry is read: the
    // capture can only ever contain the pixels the screen actually drew, so
    // real estate here is the only thing that adds real detail.
    await sleep(FS_SETTLE).catch(() => { });
    const cropped = await cropToStage(track);
    // Deliberately NOT upscaled. Asking the track for 2160x3840 does not
    // re-render anything — it stretches whatever was captured, so a small
    // region becomes a soft 4K file that looks worse than the sharp native
    // one and burns the bitrate carrying the blur. Record true pixels.
    try { await track.applyConstraints({ frameRate: 30 }); } catch (e) { }
    if (!cropped) notice("Heads up: this browser can't crop the capture to the post, so the file will be the whole window. Chrome or Edge crops it to a clean vertical video.", 9000);

    const set = track.getSettings?.() || {};
    const px = (set.width || 1080) * (set.height || 1920);
    // ~0.13 bits per pixel per frame, floor 12 Mbps, ceiling 60 Mbps — scaled
    // to what is actually being encoded rather than to a nominal label
    const bpp = S.exportQ === "balanced" ? 0.07 : 0.13;
    const bitrate = Math.max(S.exportQ === "balanced" ? 6e6 : 12e6, Math.min(60e6, Math.round(px * 30 * bpp)));
    const mime = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp9", "video/webm"].find(m => window.MediaRecorder?.isTypeSupported(m)) || "video/webm";
    try {
      recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: bitrate });
    } catch (e) { recorder = new MediaRecorder(stream); }
    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    track.addEventListener("ended", () => reelAbort?.abort());
  }

  document.body.classList.add("rec-mode", "reel-playing");
  blip(500, .12);
  await countdown(3);
  if (recorder) recorder.start(250);

  startMusic();
  reelAbort = new AbortController();
  $$(".tpl", stage).forEach(el => el.remove());
  try {
    await playReelSequence(stage, { signal: reelAbort.signal });
  } catch (e) { /* stopped early — still export whatever was captured */ }
  stopMusic();

  if (record) {
    await sleep(200).catch(() => { });
    if (recorder.state !== "inactive") {
      const stopped = new Promise(res => { recorder.onstop = res; });
      recorder.stop();
      await stopped;
    }
    const settings = track?.getSettings?.() || {};
    stream.getTracks().forEach(t => t.stop());
    exitRecord();
    if (!chunks.length) {
      notice("Nothing was captured — the recording stopped before any video arrived. Try again and leave this tab in front while it plays.", 10000);
    } else {
      const blob = new Blob(chunks, { type: "video/webm" });
      const res = await deliverFile(blob, `bloomzein-reel-${Date.now()}.webm`);
      const w = settings.width || 0, h = settings.height || 0;
      const size = w && h ? `${w}×${h}` : "";
      if (!res.ok) notice(res.msg, 10000);
      else if (h && h < 1600) notice(`Reel exported at ${size} · ${(blob.size / 1048576).toFixed(1)} MB. That's the real pixel count your screen drew — the recording can't contain more than the display shows. For a sharper file, record on a larger or higher-resolution screen; the post is already given the full screen height.`, 0);
      else notice(`Reel exported${size ? " at " + size : ""} · ${(blob.size / 1048576).toFixed(1)} MB (WebM).`, 9000);
    }
  } else {
    exitRecord();
  }
  if (S.activeScene) selectScene(S.activeScene); else renderStage();
}
$("#playReelBtn").addEventListener("click", () => runReel({ record: false }));
$("#exportReelBtn").addEventListener("click", () => runReel({ record: true }));

/* ────────────────────────── mode & reel controls ──────────────────────── */
$$("#modeTabs button").forEach(b => b.addEventListener("click", () => { setMode(b.dataset.mode); blip(700, .1); }));
$("#transitionSel").addEventListener("change", e => { S.transition = e.target.value; save(); });
$("#resSel").addEventListener("change", e => { S.exportQ = e.target.value; save(); });

/* ───────────────────────────────── boot ──────────────────────────────── */
/* A returning visitor's saved project (localStorage) survives every future
   version of this file, forever, on the same fixed KEY — so a schema change
   that an empty-storage test never catches can still crash boot on THEIR
   real data, every single time they open it, because the crash never
   touches the save that keeps reproducing it. Each step below is isolated so
   one bad section (e.g. a corrupted reel) can't blank the whole page or
   leave the rest of the UI's buttons dead; a visible banner (with a way to
   wipe the saved project and start clean) appears only if something failed. */
let bootFailed = false;
function safeBoot(label, fn) {
  try { fn(); } catch (e) { bootFailed = true; console.error(`Post Studio: ${label} failed to load —`, e); }
}
function showBootBanner() {
  if ($("#bootBanner")) return;
  const bar = document.createElement("div");
  bar.id = "bootBanner";
  bar.innerHTML = `<span>Something in your saved project didn't load right — the app should still mostly work.</span>
    <button type="button" id="bootRetry">Try again</button>
    <button type="button" id="bootReset">Reset saved project</button>`;
  document.body.appendChild(bar);
  $("#bootRetry", bar).addEventListener("click", () => location.reload());
  $("#bootReset", bar).addEventListener("click", () => {
    try { localStorage.removeItem(KEY); } catch (e) { }
    location.reload();
  });
}
/* a copy saved out of a page that couldn't record carries the project with
   it; import that BEFORE the first render, because applyMedia() clears a
   media reference whose blob it can't find and would wipe the clips */
async function boot() {
  let imported = null;
  try { imported = await importSeed(); } catch (e) { bootFailed = true; console.error("Post Studio: project import failed —", e); }
  safeBoot("mode/format toggles", () => {
  document.body.classList.toggle("guides", S.guides);
  $("#guidesBtn").setAttribute("aria-pressed", String(S.guides));
  $$("#fmt button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.fmt === S.fmt)));
  if (!TPL[S.tpl]) S.tpl = "hook";
  S.reel = (S.reel || []).filter(sc => sc && TPL[sc.tpl]);
  if (S.activeScene && !S.reel.some(sc => sc.id === S.activeScene)) S.activeScene = S.reel[0]?.id || null;
  if (S.mode !== "single" && S.mode !== "reel") S.mode = "single";
  $$("#modeTabs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === S.mode)));
  document.body.classList.toggle("mode-reel", S.mode === "reel");
  $("#transitionSel").value = S.transition || "fade";
  if (S.exportQ !== "balanced") S.exportQ = "max";
  $("#resSel").value = S.exportQ;
});
  safeBoot("thumbnails", buildThumbs);
  safeBoot("reel filmstrip", renderFilmstrip);
  safeBoot("stage", renderStage);
  safeBoot("settings panel", buildPanel);
  safeBoot("music", loadMusic);
  safeBoot("crop drag", wireCropDragGlobal);
  safeBoot("no-capture hint", () => {
  // only when the browser positively says capture is refused — an unknown
  // answer must not nag someone whose Export would have worked fine
  if (captureAllowed() !== false) return;
  document.body.classList.add("framed");
  $("#exportReelBtn").title = "This page isn't allowed to record the screen — save the studio as a file and open that in Chrome to export.";
  $("#framedWhy").addEventListener("click", () => {
    notice("Recording the screen isn't allowed on this page, and it can't open a tab for itself either — so Export can't build the video here. Save the studio as a file instead: your clips, text and reel come with it, and opening that file in Chrome lets Export record and download normally.",
      0, saveCopyAction);
  });
});
  if (bootFailed) showBootBanner();
  if (imported) {
    notice(imported.clips === imported.expected
      ? `Your project loaded from this file — ${imported.clips} clip${imported.clips === 1 ? "" : "s"} restored. Export works here.`
      : `Project loaded, but only ${imported.clips} of ${imported.expected} clips came through — re-add the missing ones before exporting.`, 9000);
  }
}
boot();
</script>
